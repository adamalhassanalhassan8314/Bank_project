<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f6fb;
}

.container{
    width:95%;
    max-width:550px;
    margin:60px auto;
}

.card{
    background:white;
    border-radius:25px;
    padding:40px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.card h2{
    color:indigo;
    margin-bottom:30px;
}

.preview{
    width:180px;
    height:180px;
    border-radius:50%;
    object-fit:cover;
    border:5px solid #6C63FF;
    margin-bottom:25px;
}

.file-box{
    margin:20px 0;
}

.file-box input{
    width:100%;
    padding:12px;
    border:2px dashed #6C63FF;
    border-radius:12px;
}

.btn{
    width:100%;
    height:55px;
    border:none;
    border-radius:15px;
    background:indigo;
    color:white;
    font-size:18px;
    cursor:pointer;
    margin-top:20px;
}

.btn:hover{
    background:#4b0082;
}

.back{
    display:inline-block;
    margin-top:20px;
    text-decoration:none;
    color:indigo;
    font-weight:bold;
}

</style>

</head>
<body>

<div class="container">

<div class="card">

<h2>
<i class="bi bi-camera-fill"></i>
Change Profile Photo
</h2>

<img
src="{{ request.user.profile.image.url }}"
id="preview"
class="preview">

<form method="POST" enctype="multipart/form-data" id="photoForm">
    {% csrf_token %}

    <label for="imageInput" class="change-btn">
        <i class="bi bi-camera-fill"></i>
        Change Photo
    </label>

    <input
        type="file"
        name="image"
        id="imageInput"
        accept="image/*"
        hidden>
</form>



<script>
const imageInput = document.getElementById("imageInput");
const photoForm = document.getElementById("photoForm");

imageInput.addEventListener("change", function(){

    if(this.files.length > 0){

        photoForm.submit();

    }

});
</script>

</body>
</html>
