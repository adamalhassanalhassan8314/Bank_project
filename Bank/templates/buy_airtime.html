body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f7f8fc;
}

.confirm{
    width:90%;
    max-width:900px;
    margin:40px auto;
}

.title{
    text-align:center;
    margin-bottom:35px;
}

.title h2{
    font-size:35px;
    color:#2d2d2d;
    margin-bottom:8px;
}

.title p{
    color:gray;
}

.networks{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
    margin-bottom:35px;
}

.network-box{
    background:white;
    height:120px;
    border-radius:18px;
    display:flex;
    justify-content:center;
    align-items:center;
    cursor:pointer;
    border:2px solid transparent;
    transition:.3s;
    box-shadow:0 10px 25px rgba(0,0,0,.08);
}

.network-box:hover{
    transform:translateY(-6px);
}

.network-box:has(input:checked){
    border-color:#6a0dad;
    box-shadow:0 0 20px rgba(106,13,173,.3);
}

.network-box img{
    width:90px;
}

.enter-phone p{
    font-size:18px;
    font-weight:bold;
    margin-bottom:10px;
}

.confirm input{
    width:100%;
    height:60px;
    border:2px solid #ddd;
    border-radius:15px;
    padding:0 20px;
    font-size:20px;
    outline:none;
}

.confirm input:focus{
    border-color:#6a0dad;
}

button{
    width:100%;
    height:65px;
    margin-top:30px;
    border:none;
    border-radius:15px;
    color:white;
    font-size:20px;
    font-weight:bold;
    background:linear-gradient(90deg,#5f0a87,#a4508b);
    cursor:pointer;
    transition:.3s;
}

button:hover{
    transform:scale(1.02);
}
    </style>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body style="background-color: white;">
    
<form method="POST">
{% csrf_token %}


<div class="title">
    <h2>Buy Airtime</h2>
    <p>Select your network and enter your phone number</p>
</div>

<div class="confirm">
    <div class="networks">


    <label class="network-box">
        <input type="radio" name="network" value="01" hidden>
        <img src="/static/images/mtn.png">
    </label>

    <label class="network-box">
        <input type="radio" name="network" value="02" hidden>
        <img src="/static/images/airtel.png">
    </label>

    <label class="network-box">
        <input type="radio" name="network" value="03" hidden>
        <img src="/static/images/glo.png">
    </label>

    <label class="network-box">
        <input type="radio" name="network" value="04" hidden>
        <img src="/static/images/9mobile.png">
    </label>

    <br><br><br>

</div>

 <div class="enter-phone">
     <p>Enter Your Phone Number</p>
    <input type="text" class=" " name="phone" required>
     </div> <br><br><br><br><br><br>


    <button type="submit" >Confirm</button>


    </div>

   

</form>





<script>
    const boxes = document.querySelectorAll('.network-box');

boxes.forEach(box => {
    box.addEventListener('click', () => {
        boxes.forEach(b => b.style.border = '3px solid transparent');
        box.style.border = '3px solid indigo';
    });
});
</script>
</body>
</html>
