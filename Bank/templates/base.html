
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}B2DATA{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#f6f7fb;
    font-family:Arial,sans-serif;
}

/* ================= TOP NAVBAR ================= */

body{
    background:#F8F9FC;
}



.dashboard-header{

    position: fixed;

    top: 0;
    left: 0;

    width: 100%;
    height: 80px;

    background: white;

    display: flex;
    justify-content: space-between;
    align-items: center;

    padding: 0 20px;

    z-index: 1000;

    box-shadow: 0 2px 10px rgba(0,0,0,.08);
}


.left{

    display:flex;

    align-items:center;

    gap:15px;

}

.profile-image{

    width:60px;

    height:60px;

    border-radius:50%;

    object-fit:cover;

    border:3px solid #6C63FF;

}

.left small{

    color:#888;

}

.left h4{

    margin:0;

    color:#1E1E2F;

}

.right i{

    font-size:30px;

    color:#6C63FF;

}
/* ================= PAGE ================= */

.main-content{

    padding-top:90px;
    padding-bottom:90px;

}

/* ================= BOTTOM NAV ================= */

.bottom-nav{
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;

    height: 100px;

    background: white;

    display: flex;
    justify-content: space-around;
    align-items: center;

    border-top:1px solid #ddd;

    box-shadow:0 -2px 10px rgba(0,0,0,.1);

    z-index:999;
}

.service-box{

    text-decoration:none;

    color:#777;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    gap:4px;

    flex:1;

    height:100%;

    background:transparent;

    padding:0;

    border:none;

    border-radius:0;
}

.service-box{
    color:#777;
    text-decoration:none;
    transition:.3s;
}

.service-box.active{
    color:#6C63FF;
}

.service-box.active i{
    color:#6C63FF;
}

.service-box.active span{
    color:#6C63FF;
}

</style>

</head>

<body>

<!-- ================= TOP NAV ================= -->

<div class="dashboard-header">

    <div class="left">

        <img src="{{ request.user.profile.image.url }}"
        class="profile-image">

        <div>

            <small>Good Morning 👋</small>

            <h4>{{ request.user.profile.fullname }}</h4>

        </div>

    </div>

    <div class="right">
        <b style="font-size: 30px; color: indigo">Wellcome to B2DATA</b>
        <i class="bi bi-bell"></i>
        
    </div>
</div>
<!-- ================= PAGE CONTENT ================= -->

<div class="main-content">

{% block content %}

{% endblock %}

</div>


<!-- ================= BOTTOM NAV ================= -->

<div class="bottom-nav">

<a href="{% url 'dashboard' %}"
class="service-box {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">

    <i class="bi bi-house-door-fill"></i>
    <span>Home</span>

</a>



<a href="{% url 'history' %}"
class="service-box {% if request.resolver_match.url_name == 'history' %}active{% endif %}">

    <i class="bi bi-clock-history"></i>
    <span>History</span>

</a>


<a href="{% url 'bonus' %}"
class="service-box {% if request.resolver_match.url_name == 'bonus' %}active{% endif %}">

    <i class="bi bi-gift-fill"></i>
    <span>Bonus</span>

</a>




<a href="{% url 'content' %}"
class="service-box {% if request.resolver_match.url_name == 'content' %}active{% endif %}">

    <i class="bi bi-person-circle"></i>
    <span>Me</span>

</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>


<script>
const serviceBoxes = document.querySelectorAll(".service-box");

serviceBoxes.forEach(box => {

    box.addEventListener("click", function(){

        // Cire active daga duka
        serviceBoxes.forEach(item => {
            item.classList.remove("active");
        });

        // Saka active ga wanda aka danna
        this.classList.add("active");

    });

});
</script> 
</body>
</html>
```
