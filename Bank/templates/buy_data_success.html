

<style>
    .success-page {
        min-height: calc(100vh - 80px);
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 30px 20px 100px;
        background: #f8f7fc;
    }

    .success-card {
        width: 500%;
        max-width: 900px;
        background: white;
        border-radius: 28px;
        padding: 45px 35px;
        text-align: center;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.08);
    }

    .success-icon {
        width: 110px;
        height: 110px;
        margin: 0 auto 25px;
        border-radius: 50%;
        background: #16b65b;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: pop 0.5s ease;
    }

    .success-icon i {
        color: white;
        font-size: 65px;
    }

    .success-card h2 {
        color: #4b0082;
        font-size: 38px;
        font-weight: 700;
        margin-bottom: 12px;
    }

    .success-message {
        color: #777;
        font-size: 18px;
        margin-bottom: 30px;
    }

    .transaction-box {
        background: #f8f7fc;
        border-radius: 18px;
        padding: 20px;
        margin-bottom: 30px;
        text-align: left;
    }

    .transaction-row {
        display: flex;
        justify-content: space-between;
        padding: 12px 0;
        border-bottom: 1px solid #e5e5e5;
        font-size: 16px;
    }

    .transaction-row:last-child {
        border-bottom: none;
    }

    .transaction-label {
        color: #777;
    }

    .transaction-value {
        color: #333;
        font-weight: 600;
    }

    .success-status {
        color: #16b65b;
        font-weight: 700;
    }

    .done-btn {
        display: block;
        width: 100%;
        padding: 15px;
        border-radius: 14px;
        background: #4b0082;
        color: white;
        text-decoration: none;
        font-size: 18px;
        font-weight: 600;
        transition: 0.3s;
    }

    .done-btn:hover {
        background: #360061;
        color: white;
        transform: translateY(-2px);
    }

    @keyframes pop {
        0% {
            transform: scale(0);
            opacity: 0;
        }

        70% {
            transform: scale(1.1);
        }

        100% {
            transform: scale(1);
            opacity: 1;
        }
    }

    @media (max-width: 600px) {
        .success-card {
            padding: 35px 20px;
        }

        .success-card h2 {
            font-size: 30px;
        }

        .success-icon {
            width: 90px;
            height: 90px;
        }

        .success-icon i {
            font-size: 50px;
        }
    }
</style>


<div class="success-page">

    <div class="success-card">

        <!-- Success Icon -->
        <div class="success-icon">
            <i class="bi bi-check-lg"></i>
        </div>


        <!-- Title -->
        <h2>Data Purchase Successful</h2>

        <p class="success-message">
            Your data has been delivered successfully.
        </p>


        <!-- Transaction Details -->
        <div class="transaction-box">

            <div class="transaction-row">
                <span class="transaction-label">Service</span>
                <span class="transaction-value">Data</span>
            </div>

            <div class="transaction-row">
                <span class="transaction-label">Status</span>
                <span class="transaction-value success-status">
                    Successful
                </span>
            </div>

        </div>


        <!-- Button -->
        <a href="{% url 'dashboard' %}" class="done-btn">
            Done
        </a>

    </div>

</div>


<!-- Bootstrap Icons -->
<link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
>
