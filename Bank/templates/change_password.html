<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<title>Change Password</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f6fb;
}

.container{
width:95%;
max-width:700px;
margin:60px auto;
}

.card{
background:white;
padding:40px;
border-radius:25px;
box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.icon-box{

width:90px;
height:90px;

margin:auto;

border-radius:50%;

background:#ede9fe;

display:flex;

justify-content:center;

align-items:center;

}

.icon-box i{

font-size:45px;

color:indigo;

}

h2{

text-align:center;

margin:20px 0;

color:#222;

}

.desc{

text-align:center;

color:#777;

margin-bottom:35px;

}

.input-group{

margin-bottom:20px;

}

.input-group label{

display:block;

font-weight:bold;

margin-bottom:8px;

}

.password-box{

position:relative;

}

.password-box input{

width:100%;

height:55px;

padding:0 50px 0 15px;

border:1px solid #ddd;

border-radius:12px;

font-size:17px;

}

.eye{

position:absolute;

right:15px;

top:50%;

transform:translateY(-50%);

cursor:pointer;

color:#777;

}

button{

width:100%;

height:55px;

border:none;

border-radius:15px;

background:indigo;

color:white;

font-size:18px;

cursor:pointer;

margin-top:15px;

transition:.3s;

}

button:hover{

background:#4b0082;

}

.back{

display:block;

text-align:center;

margin-top:20px;

text-decoration:none;

font-weight:bold;

color:indigo;

}

</style>

</head>

<body>

<div class="container">

<div class="card">

<div class="icon-box">

<i class="bi bi-lock-fill"></i>

</div>

<h2>

Change Password

</h2>

<p class="desc">

Secure your account with a new password.

</p>

<form method="POST">

{% csrf_token %}

<div class="input-group">

<label>Current Password</label>

<div class="password-box">

<input
type="password"
name="old_password"
id="old_password"
required>

<i class="bi bi-eye eye"
onclick="togglePassword('old_password',this)"></i>

</div>

</div>

<div class="input-group">

<label>New Password</label>

<div class="password-box">

<input
type="password"
name="new_password"
id="new_password"
required>

<i class="bi bi-eye eye"
onclick="togglePassword('new_password',this)"></i>

</div>

</div>

<div class="input-group">

<label>Confirm Password</label>

<div class="password-box">

<input
type="password"
name="confirm_password"
id="confirm_password"
required>

<i class="bi bi-eye eye"
onclick="togglePassword('confirm_password',this)"></i>

</div>

</div>

<button>

<i class="bi bi-check-circle-fill"></i>

Update Password

</button>

</form>

<a href="{% url 'content' %}" class="back">

<i class="bi bi-arrow-left"></i>

Back to Profile

</a>

</div>

</div>

<script>

function togglePassword(id,icon){

let input=document.getElementById(id);

if(input.type==="password"){

input.type="text";

icon.classList.replace("bi-eye","bi-eye-slash");

}else{

input.type="password";

icon.classList.replace("bi-eye-slash","bi-eye");

}

}

</script>

</body>
</html>
