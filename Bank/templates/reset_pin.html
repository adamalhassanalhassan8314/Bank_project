
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<title>Reset PIN</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f6fb;
}

.container{
    width:95%;
    max-width:700px;
    margin:60px auto;
}

.card{
    background:white;
    border-radius:25px;
    padding:40px;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.icon-box{
    width:90px;
    height:90px;
    margin:auto;
    border-radius:50%;
    background:#ede9fe;
    display:flex;
    justify-content:center;
    align-items:center;
}

.icon-box i{
    font-size:45px;
    color:indigo;
}

h2{
    text-align:center;
    margin:20px 0 10px;
    color:#222;
}

.desc{
    text-align:center;
    color:#777;
    margin-bottom:35px;
}

.input-group{
    margin-bottom:20px;
}

.input-group label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
}

.pin-box{
    position:relative;
}

.pin-box input{
    width:100%;
    height:55px;
    border:1px solid #ddd;
    border-radius:12px;
    padding:0 45px 0 15px;
    font-size:18px;
}

.eye{
    position:absolute;
    right:15px;
    top:50%;
    transform:translateY(-50%);
    cursor:pointer;
    color:#777;
}

button{
    width:100%;
    height:55px;
    border:none;
    border-radius:15px;
    background:indigo;
    color:white;
    font-size:18px;
    cursor:pointer;
    margin-top:15px;
}

button:hover{
    background:#4b0082;
}

.back{
    display:block;
    text-align:center;
    margin-top:20px;
    text-decoration:none;
    color:indigo;
    font-weight:bold;
}

.messages{
    justify-self:center;
    font-size:30px;
    font-weight:bold;
    color:green;
}

</style>

</head>

<body>

<div class="container">

<div class = "messages">
    {% if messages %}

    {% for message in messages %}

        <div class="alert alert-success">
            {{ message }}
        </div>

    {% endfor %}

{% endif %}
</div>

<div class="card">

<div class="icon-box">
<i class="bi bi-shield-lock-fill"></i>
</div>

<h2>Reset Transaction PIN</h2>

<p class="desc">
Enter your current PIN and create a new one.
</p>

<form method="POST">

{% csrf_token %}

<div class="input-group">

<label>Current PIN</label>

<div class="pin-box">

<input
type="password"
name="old_pin"
id="old_pin"
maxlength="4"
required>

<i class="bi bi-eye eye"
onclick="togglePin('old_pin',this)"></i>

</div>

</div>

<div class="input-group">

<label>New PIN</label>

<div class="pin-box">

<input
type="password"
name="new_pin"
id="new_pin"
maxlength="4"
required>

<i class="bi bi-eye eye"
onclick="togglePin('new_pin',this)"></i>

</div>

</div>

<div class="input-group">

<label>Confirm PIN</label>

<div class="pin-box">

<input
type="password"
name="confirm_pin"
id="confirm_pin"
maxlength="4"
required>

<i class="bi bi-eye eye"
onclick="togglePin('confirm_pin',this)"></i>

</div>

</div>

<button>
<i class="bi bi-check-circle-fill"></i>
Update PIN
</button>

</form>

<a href="{% url 'content' %}" class="back">
<i class="bi bi-arrow-left"></i>
Back to Profile
</a>

</div>

</div>

<script>

function togglePin(id,icon){

const input=document.getElementById(id);

if(input.type==="password"){

input.type="text";

icon.classList.remove("bi-eye");

icon.classList.add("bi-eye-slash");

}else{

input.type="password";

icon.classList.remove("bi-eye-slash");

icon.classList.add("bi-eye");

}

}

</script>

</body>
</html>
```
