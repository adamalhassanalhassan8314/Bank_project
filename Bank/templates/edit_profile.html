<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>

body{
    background:#f5f6fb;
    font-family:Arial,sans-serif;
}

.container{

    width:95%;
    max-width:650px;

    margin:50px auto;

}

.card{

    background:white;

    border-radius:25px;

    padding:35px;

    box-shadow:0 10px 30px rgba(0,0,0,.08);

}

h2{

    text-align:center;

    color:indigo;

    margin-bottom:30px;

}

.input-group{

    margin-bottom:20px;

}

label{

    display:block;

    margin-bottom:8px;

    font-weight:bold;

}

input{

    width:100%;

    height:55px;

    border:1px solid #ddd;

    border-radius:12px;

    padding:0 15px;

    font-size:17px;

}

button{

    width:100%;

    height:55px;

    border:none;

    border-radius:15px;

    background:indigo;

    color:white;

    font-size:18px;

    cursor:pointer;

}

button:hover{

    background:#4b0082;

}

.back{

    display:block;

    text-align:center;

    margin-top:20px;

    color:indigo;

    text-decoration:none;

    font-weight:bold;

}

</style>

</head>

<body>

<div class="container">

<div class="card">

<h2>

<i class="bi bi-person-fill"></i>

Edit Profile

</h2>

<form method="POST">

{% csrf_token %}

<div class="input-group">

<label>Full Name</label>

<input
type="text"
name="fullname"
value="{{ profile.fullname }}"
required>

</div>

<div class="input-group">

<label>Phone Number</label>

<input
type="text"
name="phone"
value="{{ profile.phone }}"
required>

</div>

<div class="input-group">

<label>Email</label>

<input
type="email"
name="email"
value="{{ profile.email }}"
required>

</div>

<button>

<i class="bi bi-check-circle"></i>

Save Changes

</button>

</form>

<a href="{% url 'content' %}" class="back">

<i class="bi bi-arrow-left"></i>

Back to Profile

</a>

</div>

</div>

</body>
</html>
